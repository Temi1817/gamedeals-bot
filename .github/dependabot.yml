# Публичный репозиторий: за уязвимостями в зависимостях удобнее следить
# автоматом, чем вспоминать раз в полгода.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  # Экшены в CI тоже стареют и тоже бывают уязвимы
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
